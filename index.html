<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الشلول للتايكوندو">
<meta name="description" content="نظام إدارة طلاب مركز الشلول للتايكوندو">
<title>مركز الشلول للتايكوندو</title>
<link rel="manifest" href="#" id="manifest-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f7f7f9;
  --border: #e0e0ea;
  --border2: #ebebf2;
  --text: #0d0d0d;
  --text2: #6b6b80;
  --red: #cc1a1a;
  --red-dark: #a01212;
  --green: #1a7a1a;
  --header: #0d0d0d;
  --nav: #111111;
  --jordan-red: #cc1a1a;
  --jordan-green: #1a6b1a;
  --jordan-black: #0d0d0d;
  --font: 'Cairo', sans-serif;
}
[data-theme="dark"] {
  --bg: #111118;
  --surface: #1c1c26;
  --surface2: #16161e;
  --border: #2a2a3a;
  --border2: #222230;
  --text: #e8e8f0;
  --text2: #8888a0;
  --header: #080810;
  --nav: #060610;
}
[data-theme="dark"] .b-act{background:#0f2a08;color:#5ec43e}
[data-theme="dark"] .b-exp{background:#2a0a0a;color:#f07070}
[data-theme="dark"] .b-soon{background:#2a1a04;color:#e8a030}
[data-theme="dark"] .b-m{background:#081830;color:#5090e8}
[data-theme="dark"] .b-f{background:#280a18;color:#e870a8}
[data-theme="dark"] .belt-opt.sel{background:#1a0808;color:#cc1a1a;border-color:#cc1a1a}
[data-theme="dark"] input,[data-theme="dark"] select{background:var(--surface2);color:var(--text);border-color:var(--border)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);direction:rtl;background:var(--bg);min-height:100vh;transition:background .3s,color .3s}

/* ── Lock Screen ── */
#lock-screen{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(160deg,#0d0d0d 0%,#1a0505 50%,#050d0d 100%);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
  padding:30px 20px;
}
#lock-screen.hide{display:none}

.lock-logo{
  width:160px;height:160px;margin-bottom:24px;
  animation:logoIn .8s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}

.lock-title{
  color:white;font-size:22px;font-weight:700;
  text-align:center;margin-bottom:4px;
  animation:fadeUp .6s .2s both;
}
.lock-sub{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:32px;animation:fadeUp .6s .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.lock-box{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:24px 22px;
  width:100%;max-width:340px;
  animation:fadeUp .6s .4s both;
  backdrop-filter:blur(10px);
}
.lock-label{color:rgba(255,255,255,.7);font-size:12px;margin-bottom:7px;display:block}
.lock-input-wrap{position:relative;margin-bottom:16px}
.lock-inp{
  width:100%;padding:11px 14px 11px 40px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;color:white;
  font-family:var(--font);font-size:14px;
  letter-spacing:3px;direction:ltr;text-align:center;
  transition:border-color .2s,background .2s;
}
.lock-inp:focus{outline:none;border-color:#cc1a1a;background:rgba(204,26,26,.1)}
.lock-inp::placeholder{letter-spacing:1px;color:rgba(255,255,255,.3)}
.eye-btn{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;
  font-size:16px;padding:4px;
}
.lock-btn{
  width:100%;padding:12px;
  background:linear-gradient(135deg,#cc1a1a,#8b0000);
  color:white;border:none;border-radius:10px;
  font-family:var(--font);font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 20px rgba(204,26,26,.4);
}
.lock-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(204,26,26,.5)}
.lock-btn:active{transform:translateY(0)}
.lock-err{
  color:#f07070;font-size:12px;text-align:center;
  margin-top:10px;min-height:18px;
  transition:opacity .2s;
}
.lock-err.hide{opacity:0}

/* ── PWA Banner ── */
#pwa-banner{
  display:none;background:linear-gradient(135deg,#0d0d0d,#1a1a2e);
  color:white;padding:10px 16px;
  align-items:center;justify-content:space-between;gap:10px;
  font-size:13px;border-bottom:1px solid rgba(204,26,26,.3);
}
#pwa-banner.show{display:flex}
.pwa-btn{background:#cc1a1a;color:white;border:none;padding:6px 14px;border-radius:20px;font-family:var(--font);font-size:12px;cursor:pointer}
.pwa-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;padding:0 4px}

/* ── App Shell ── */
.app{min-height:100vh}
.header{
  background:var(--header);color:white;
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
  border-bottom:2px solid #cc1a1a;
}
.logo-wrap{flex-shrink:0;width:46px;height:46px}
.logo-wrap svg{width:46px;height:46px}

/* Real logo SVG embedded */
.logo-img{width:46px;height:46px;border-radius:50%;object-fit:cover}

.header-info{flex:1}
.header h1{font-size:15px;font-weight:700;color:white;letter-spacing:.3px}
.header p{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
.header-btns{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:white;width:34px;height:34px;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .2s,transform .2s;
}
.icon-btn:hover{background:rgba(204,26,26,.4);transform:rotate(15deg)}

.nav{
  background:var(--nav);display:flex;gap:2px;
  padding:6px 14px;overflow-x:auto;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.nb{
  padding:7px 12px;border:none;background:transparent;
  color:rgba(255,255,255,.55);font-family:var(--font);font-size:13px;
  cursor:pointer;border-radius:8px;
  display:flex;align-items:center;gap:5px;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.nb.active,.nb:hover{background:#cc1a1a;color:white}

/* ── Content ── */
.content{padding:16px;display:none}
.content.show{display:block}
.card{
  background:var(--surface);border:0.5px solid var(--border2);
  border-radius:14px;padding:18px;margin-bottom:14px;
  transition:background .3s,border-color .3s;
}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:7px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{
  background:var(--surface);border:0.5px solid var(--border2);
  border-radius:12px;padding:14px;text-align:center;
  transition:background .3s;
}
.stat-n{font-size:26px;font-weight:700}
.stat-l{font-size:11px;color:var(--text2);margin-top:3px}

/* Form */
.fg{display:flex;flex-direction:column;gap:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{font-size:12px;color:var(--text2);font-weight:500}
input,select{
  padding:8px 10px;border:0.5px solid var(--border);
  border-radius:9px;font-family:var(--font);font-size:13px;
  background:var(--surface);color:var(--text);
  direction:rtl;width:100%;
  transition:background .3s,color .3s,border-color .2s;
}
input:focus,select:focus{outline:none;border-color:#cc1a1a;box-shadow:0 0 0 3px rgba(204,26,26,.1)}

/* Buttons */
.btn-p{
  background:linear-gradient(135deg,#cc1a1a,#8b0000);
  color:white;border:none;padding:9px 20px;border-radius:9px;
  font-family:var(--font);font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 2px 12px rgba(204,26,26,.3);transition:transform .15s,box-shadow .15s;
}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(204,26,26,.4)}
.btn-s{
  background:transparent;color:var(--text2);
  border:0.5px solid var(--border);padding:7px 14px;
  border-radius:9px;font-family:var(--font);font-size:13px;cursor:pointer;
  transition:background .15s;
}
.btn-s:hover{background:var(--surface2)}

/* Filter */
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fb{
  padding:5px 12px;border:0.5px solid var(--border);
  border-radius:20px;background:transparent;
  font-size:12px;cursor:pointer;color:var(--text2);
  font-family:var(--font);transition:all .15s;
}
.fb.active{background:#cc1a1a;color:white;border-color:#cc1a1a}

/* Table */
.tbl-wrap{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.st th{
  padding:9px 10px;text-align:right;font-weight:600;
  color:var(--text2);border-bottom:0.5px solid var(--border2);font-size:11px;
}
table.st td{
  padding:9px 10px;border-bottom:0.5px solid var(--border2);
  color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
table.st tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-act{background:#e8f5e0;color:#2a6b10}
.b-exp{background:#fce8e8;color:#a01414}
.b-soon{background:#fef3e0;color:#7a4a08}
.b-m{background:#e4f0fc;color:#1455a0}
.b-f{background:#fce8f4;color:#922858}

/* Belt */
.belt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.belt-opt{
  border:0.5px solid var(--border);border-radius:9px;
  padding:7px 8px;cursor:pointer;font-size:12px;font-weight:500;
  display:flex;align-items:center;gap:6px;
  background:var(--surface);color:var(--text);transition:all .12s;
}
.belt-opt:hover{border-color:#cc1a1a}
.belt-opt.sel{border-color:#cc1a1a;background:#fff0f0;color:#8b0000}

/* Actions */
.act-btns{display:flex;gap:5px}
.ib{
  background:transparent;border:0.5px solid var(--border2);
  border-radius:8px;padding:4px 7px;cursor:pointer;
  color:var(--text2);font-size:13px;transition:all .15s;
}
.ib:hover{border-color:#cc1a1a;color:#cc1a1a}
.ib.del:hover{color:#a01414;border-color:#f09595}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:13px}
.divider{border:none;border-top:0.5px solid var(--border2);margin:14px 0}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:100;backdrop-filter:blur(4px);
}
.modal-bg.show{display:flex}
.modal{
  background:var(--surface);border-radius:16px;
  padding:22px;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;transition:background .3s;
}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text2);padding:2px 6px}

/* Detail rows */
.detail-row{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:0.5px solid var(--border2);
  font-size:13px;color:var(--text);
}
.detail-row:last-child{border-bottom:none}
.dk{color:var(--text2)}

/* Toast */
.toast-area{min-height:40px;display:flex;align-items:center;justify-content:center;padding:4px 0}
.toast{
  background:#0d0d0d;color:white;padding:10px 18px;
  border-radius:9px;font-size:13px;
  display:none;align-items:center;gap:7px;
  border-left:3px solid #1a7a1a;
}
.toast.show{display:inline-flex}
.toast.err{background:#6b0a0a;border-left-color:#cc1a1a}

@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .belt-grid{grid-template-columns:repeat(3,1fr)}
  table.st th:nth-child(4),table.st td:nth-child(4){display:none}
}
</style>
</head>
<body>

<!-- ── Lock Screen ── -->
<div id="lock-screen">
  <!-- Real Logo as SVG recreation of the circular Alshlool logo -->
  <svg class="lock-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer circle border -->
    <circle cx="100" cy="100" r="97" fill="white" stroke="#0d0d0d" stroke-width="3"/>
    <!-- Jordan red arc (left) -->
    <path d="M 18 100 A 82 82 0 0 1 100 18" fill="none" stroke="#cc1a1a" stroke-width="16" stroke-linecap="round"/>
    <!-- Jordan green arc (right) -->
    <path d="M 100 18 A 82 82 0 0 1 182 100" fill="none" stroke="#1a6b1a" stroke-width="16" stroke-linecap="round"/>
    <!-- Black bottom arc -->
    <path d="M 182 100 A 82 82 0 0 1 18 100" fill="none" stroke="#0d0d0d" stroke-width="16" stroke-linecap="round"/>
    <!-- Swoosh / dynamic lines -->
    <path d="M 30 130 Q 80 80 160 60" fill="none" stroke="#cc1a1a" stroke-width="3" opacity=".7"/>
    <path d="M 40 145 Q 90 95 170 75" fill="none" stroke="#1a6b1a" stroke-width="2" opacity=".5"/>
    <!-- Jordan star (on red area) -->
    <g transform="translate(38,88) scale(.55)">
      <polygon points="0,-14 3.3,-5 13,-5 5.5,2 8.5,12 0,6.5 -8.5,12 -5.5,2 -13,-5 -3.3,-5" fill="white"/>
    </g>
    <!-- Taekwondo silhouette figure (high kick pose) -->
    <!-- Head -->
    <circle cx="95" cy="55" r="9" fill="#0d0d0d"/>
    <!-- Body -->
    <line x1="95" y1="64" x2="95" y2="95" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
    <!-- Belt on waist -->
    <rect x="88" y="90" width="14" height="5" rx="2.5" fill="#cc8800"/>
    <!-- Left arm (guard) -->
    <line x1="95" y1="75" x2="76" y2="85" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
    <line x1="76" y1="85" x2="72" y2="96" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
    <!-- Right arm (guard up) -->
    <line x1="95" y1="75" x2="112" y2="70" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
    <line x1="112" y1="70" x2="116" y2="60" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
    <!-- Standing leg -->
    <line x1="95" y1="95" x2="88" y2="125" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
    <line x1="88" y1="125" x2="80" y2="132" stroke="#0d0d0d" stroke-width="5" stroke-linecap="round"/>
    <!-- Kicking leg HIGH KICK -->
    <line x1="95" y1="95" x2="128" y2="68" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
    <line x1="128" y1="68" x2="148" y2="45" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
    <!-- Kick foot -->
    <ellipse cx="153" cy="40" rx="9" ry="5" fill="#0d0d0d" transform="rotate(-45 153 40)"/>
    <!-- Arabic text top -->
    <text x="100" y="16" text-anchor="middle" font-family="'Cairo',Arial" font-size="10" font-weight="700" fill="#0d0d0d">مركز الشلول للتايكوندو</text>
    <!-- English text bottom -->
    <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="700" fill="#0d0d0d" letter-spacing="1.5">ALSHLOOL TAEKWONDO CENTER</text>
  </svg>

  <div class="lock-title">مركز الشلول للتايكوندو</div>
  <div class="lock-sub">نظام إدارة الطلاب</div>

  <div class="lock-box">
    <label class="lock-label">كلمة المرور</label>
    <div class="lock-input-wrap">
      <input class="lock-inp" id="lock-inp" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
      <button class="eye-btn" id="eye-btn" type="button" onclick="toggleEye()"><i class="ti ti-eye" id="eye-icon"></i></button>
    </div>
    <button class="lock-btn" onclick="tryUnlock()"><i class="ti ti-lock-open" style="font-size:14px"></i> دخول</button>
    <div class="lock-err hide" id="lock-err">كلمة المرور غير صحيحة</div>
  </div>
</div>

<!-- ── PWA Banner ── -->
<div id="pwa-banner">
  <span>📲 ثبّت تطبيق الشلول على جهازك!</span>
  <button class="pwa-btn" id="pwa-install-btn">تثبيت</button>
  <button class="pwa-close" onclick="document.getElementById('pwa-banner').classList.remove('show')">×</button>
</div>

<div class="app" id="main-app" style="display:none">
  <div class="header">
    <!-- Header Logo (smaller) -->
    <div class="logo-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="97" fill="white" stroke="#0d0d0d" stroke-width="3"/>
        <path d="M 18 100 A 82 82 0 0 1 100 18" fill="none" stroke="#cc1a1a" stroke-width="16" stroke-linecap="round"/>
        <path d="M 100 18 A 82 82 0 0 1 182 100" fill="none" stroke="#1a6b1a" stroke-width="16" stroke-linecap="round"/>
        <path d="M 182 100 A 82 82 0 0 1 18 100" fill="none" stroke="#0d0d0d" stroke-width="16" stroke-linecap="round"/>
        <path d="M 30 130 Q 80 80 160 60" fill="none" stroke="#cc1a1a" stroke-width="3" opacity=".7"/>
        <g transform="translate(38,88) scale(.55)">
          <polygon points="0,-14 3.3,-5 13,-5 5.5,2 8.5,12 0,6.5 -8.5,12 -5.5,2 -13,-5 -3.3,-5" fill="white"/>
        </g>
        <circle cx="95" cy="55" r="9" fill="#0d0d0d"/>
        <line x1="95" y1="64" x2="95" y2="95" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
        <rect x="88" y="90" width="14" height="5" rx="2.5" fill="#cc8800"/>
        <line x1="95" y1="75" x2="76" y2="85" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
        <line x1="95" y1="75" x2="112" y2="70" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
        <line x1="95" y1="95" x2="88" y2="125" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
        <line x1="95" y1="95" x2="128" y2="68" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
        <line x1="128" y1="68" x2="148" y2="45" stroke="#0d0d0d" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="153" cy="40" rx="9" ry="5" fill="#0d0d0d" transform="rotate(-45 153 40)"/>
        <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="7.5" font-weight="700" fill="#0d0d0d" letter-spacing="1.5">ALSHLOOL</text>
      </svg>
    </div>
    <div class="header-info">
      <h1>مركز الشلول للتايكوندو</h1>
      <p>نظام إدارة الطلاب</p>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="theme-toggle" title="تبديل المظهر"><i class="ti ti-moon" id="theme-icon"></i></button>
      <button class="icon-btn" onclick="lockApp()" title="قفل"><i class="ti ti-lock"></i></button>
    </div>
  </div>

  <div class="nav">
    <button class="nb active" onclick="showTab('students')" id="nb-students"><i class="ti ti-users"></i> الطلاب</button>
    <button class="nb" onclick="showTab('add')" id="nb-add"><i class="ti ti-user-plus"></i> تسجيل جديد</button>
    <button class="nb" onclick="showTab('search')" id="nb-search"><i class="ti ti-search"></i> بحث</button>
  </div>

  <!-- Students Tab -->
  <div class="content show" id="tab-students">
    <div class="stats-grid">
      <div class="stat"><div class="stat-n" id="st-total" style="color:#cc1a1a">0</div><div class="stat-l">إجمالي الطلاب</div></div>
      <div class="stat"><div class="stat-n" id="st-act" style="color:#2a6b10">0</div><div class="stat-l">اشتراك فعال</div></div>
      <div class="stat"><div class="stat-n" id="st-soon" style="color:#7a4a08">0</div><div class="stat-l">ينتهي قريباً</div></div>
      <div class="stat"><div class="stat-n" id="st-exp" style="color:#a01414">0</div><div class="stat-l">منتهي</div></div>
    </div>
    <div class="card">
      <div class="filter-row">
        <button class="fb active" onclick="setFilter('all',this)">الكل</button>
        <button class="fb" onclick="setFilter('active',this)">فعال</button>
        <button class="fb" onclick="setFilter('soon',this)">ينتهي قريباً</button>
        <button class="fb" onclick="setFilter('expired',this)">منتهي</button>
        <button class="fb" onclick="setFilter('m',this)">ذكر</button>
        <button class="fb" onclick="setFilter('f',this)">أنثى</button>
      </div>
      <div class="tbl-wrap" id="students-list"></div>
    </div>
  </div>

  <!-- Add Tab -->
  <div class="content" id="tab-add">
    <div class="card">
      <div class="sec-title"><i class="ti ti-user-plus" style="color:#cc1a1a"></i> <span id="form-title">تسجيل طالب جديد</span></div>
      <div class="form-grid">
        <div class="fg full"><label>اسم الطالب الكامل *</label><input id="f-name" type="text" placeholder="أدخل الاسم الكامل"></div>
        <div class="fg"><label>الجنس *</label>
          <select id="f-gender">
            <option value="">اختر الجنس</option>
            <option value="m">ذكر</option>
            <option value="f">أنثى</option>
          </select>
        </div>
        <div class="fg"><label>تاريخ الميلاد</label><input id="f-dob" type="date"></div>
      </div>
      <hr class="divider">
      <div class="sec-title" style="font-size:13px"><i class="ti ti-phone" style="color:#cc1a1a"></i> معلومات التواصل</div>
      <div class="form-grid">
        <div class="fg"><label>رقم هاتف الأب</label><input id="f-dad" type="tel" placeholder="07XXXXXXXX" dir="ltr"></div>
        <div class="fg"><label>رقم هاتف الأم</label><input id="f-mom" type="tel" placeholder="07XXXXXXXX" dir="ltr"></div>
      </div>
      <hr class="divider">
      <div class="sec-title" style="font-size:13px"><i class="ti ti-calendar" style="color:#cc1a1a"></i> الاشتراك</div>
      <div class="form-grid">
        <div class="fg"><label>تاريخ التسجيل *</label><input id="f-start" type="date"></div>
        <div class="fg"><label>تاريخ انتهاء الاشتراك *</label><input id="f-end" type="date"></div>
        <div class="fg full"><label>ملاحظات</label><input id="f-notes" type="text" placeholder="أي ملاحظات إضافية..."></div>
      </div>
      <hr class="divider">
      <div class="sec-title" style="font-size:13px"><i class="ti ti-award" style="color:#cc1a1a"></i> الحزام</div>
      <div id="belt-grid" class="belt-grid"></div>
      <input type="hidden" id="f-belt" value="">
      <input type="hidden" id="f-edit-id" value="">
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn-s" onclick="cancelEdit()">إلغاء</button>
        <button class="btn-p" onclick="saveStudent()"><i class="ti ti-check"></i> <span id="save-btn-lbl">حفظ التسجيل</span></button>
      </div>
    </div>
  </div>

  <!-- Search Tab -->
  <div class="content" id="tab-search">
    <div class="card">
      <div class="sec-title"><i class="ti ti-search" style="color:#cc1a1a"></i> بحث عن طالب</div>
      <input type="text" id="search-inp" placeholder="ابحث بالاسم أو رقم الهاتف..." oninput="doSearch()" style="margin-bottom:12px">
      <div class="tbl-wrap" id="search-results"></div>
    </div>
  </div>

  <div class="toast-area"><div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg"></span></div></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hdr">
      <span style="font-weight:700;font-size:15px;color:var(--text)" id="modal-title">تفاصيل الطالب</span>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const PASSWORD = 'Teakwando.2013';

// ── Lock / Unlock ──────────────────────────────────────────
const lockScreen = document.getElementById('lock-screen');
const mainApp = document.getElementById('main-app');

function tryUnlock(){
  const val = document.getElementById('lock-inp').value;
  const err = document.getElementById('lock-err');
  if(val === PASSWORD){
    lockScreen.classList.add('hide');
    mainApp.style.display = 'block';
    err.classList.add('hide');
    try{ sessionStorage.setItem('shalloul_unlocked','1'); }catch(e){}
  } else {
    err.classList.remove('hide');
    document.getElementById('lock-inp').value = '';
    document.getElementById('lock-inp').classList.add('shake');
    setTimeout(()=>document.getElementById('lock-inp').classList.remove('shake'),500);
  }
}

function lockApp(){
  try{ sessionStorage.removeItem('shalloul_unlocked'); }catch(e){}
  mainApp.style.display = 'none';
  lockScreen.classList.remove('hide');
  document.getElementById('lock-inp').value = '';
  document.getElementById('lock-err').classList.add('hide');
}

document.getElementById('lock-inp').addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });

// Auto-unlock if session active
try{
  if(sessionStorage.getItem('shalloul_unlocked')==='1'){
    lockScreen.classList.add('hide');
    mainApp.style.display = 'block';
  }
}catch(e){}

function toggleEye(){
  const inp = document.getElementById('lock-inp');
  const icon = document.getElementById('eye-icon');
  if(inp.type==='password'){
    inp.type='text';
    icon.className='ti ti-eye-off';
  } else {
    inp.type='password';
    icon.className='ti ti-eye';
  }
}

// Shake animation
const style = document.createElement('style');
style.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:shake .4s ease}';
document.head.appendChild(style);

// ── Dark Mode ──────────────────────────────────────────────
const root = document.documentElement;
const themeBtn = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
let isDark = false;
try{ isDark = localStorage.getItem('shalloul_theme')==='dark'; }catch(e){}
function applyTheme(dark){
  root.setAttribute('data-theme', dark?'dark':'light');
  themeIcon.className = dark?'ti ti-sun':'ti ti-moon';
  try{ localStorage.setItem('shalloul_theme',dark?'dark':'light'); }catch(e){}
}
applyTheme(isDark);
themeBtn.onclick = ()=>{ isDark=!isDark; applyTheme(isDark); };

// ── PWA ──────────────────────────────────────────────────
let deferredPrompt = null;
const pwaBanner = document.getElementById('pwa-banner');
const manifestData = {
  name:"مركز الشلول للتايكوندو",short_name:"الشلول",
  start_url:".",display:"standalone",
  background_color:"#0d0d0d",theme_color:"#cc1a1a",
  dir:"rtl",lang:"ar",
  icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d0d0d'/><circle cx='50' cy='50' r='45' fill='%23cc1a1a' opacity='.2'/></svg>",sizes:"512x512",type:"image/svg+xml"}]
};
const mBlob = new Blob([JSON.stringify(manifestData)],{type:'application/json'});
document.getElementById('manifest-link').href = URL.createObjectURL(mBlob);
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e; pwaBanner.classList.add('show');
});
document.getElementById('pwa-install-btn').onclick = async()=>{
  if(!deferredPrompt){ alert('افتح قائمة المتصفح واختر "إضافة إلى الشاشة الرئيسية"'); return; }
  deferredPrompt.prompt();
  const {outcome} = await deferredPrompt.userChoice;
  deferredPrompt=null; pwaBanner.classList.remove('show');
};
window.addEventListener('appinstalled',()=>pwaBanner.classList.remove('show'));
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isSA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
if(isIOS&&!isSA){
  pwaBanner.classList.add('show');
  document.getElementById('pwa-install-btn').textContent='كيف أثبّته؟';
  document.getElementById('pwa-install-btn').onclick=()=>alert('على iOS: اضغط أيقونة المشاركة ← "إضافة إلى الشاشة الرئيسية"');
}

// ── App Data ──────────────────────────────────────────────
const BELTS = [
  {id:'white',   label:'أبيض',         color:'#f0f0f0',border:'#ccc'},
  {id:'yellow',  label:'أصفر',         color:'#f5c518',border:'#c9a000'},
  {id:'y-g',     label:'أصفر وأخضر',  color:'#a8c84a',border:'#7a9e1a'},
  {id:'green',   label:'أخضر',         color:'#3a9e3a',border:'#2a7a2a'},
  {id:'g-b',     label:'أخضر وأزرق',  color:'#3a7abf',border:'#1a5a9e'},
  {id:'blue',    label:'أزرق',         color:'#1a5bbf',border:'#0e3d8a'},
  {id:'b-br',    label:'أزرق وبني',   color:'#8b5a2b',border:'#6a3e1a'},
  {id:'brown',   label:'بني',          color:'#7b3f1a',border:'#5a2c0e'},
  {id:'br-r',    label:'بني وأحمر',   color:'#c0392b',border:'#96240f'},
  {id:'red',     label:'أحمر',         color:'#e03020',border:'#b02010'},
  {id:'black',   label:'أسود',         color:'#1a1a1a',border:'#000'},
];

let students = [];
try{ students = JSON.parse(localStorage.getItem('shalloul_v2')||'[]'); }catch(e){}
let filter = 'all';

function save(){ try{ localStorage.setItem('shalloul_v2',JSON.stringify(students)); }catch(e){} }

function getStatus(end){
  if(!end) return 'active';
  const t=new Date(); t.setHours(0,0,0,0);
  const d=Math.ceil((new Date(end)-t)/86400000);
  if(d<0) return 'expired';
  if(d<=14) return 'soon';
  return 'active';
}

function sBadge(end){
  const s=getStatus(end);
  const m={active:['b-act','فعال'],soon:['b-soon','ينتهي قريباً'],expired:['b-exp','منتهي']};
  return `<span class="badge ${m[s][0]}">${m[s][1]}</span>`;
}

function gBadge(g){ return g==='m'?`<span class="badge b-m">ذكر</span>`:`<span class="badge b-f">أنثى</span>`; }

function beltBadge(id){
  if(!id) return '<span style="color:var(--text2);font-size:12px">—</span>';
  const b=BELTS.find(x=>x.id===id);
  if(!b) return '';
  const tc=(id==='white'||id==='yellow'||id==='y-g')?'#333':'#fff';
  return `<span style="display:inline-flex;align-items:center;gap:5px;background:${b.color};color:${tc};padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid ${b.border}">${b.label}</span>`;
}

function fmtDate(d){ if(!d) return '—'; const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

function updateStats(){
  document.getElementById('st-total').textContent=students.length;
  document.getElementById('st-act').textContent=students.filter(s=>getStatus(s.end)==='active').length;
  document.getElementById('st-soon').textContent=students.filter(s=>getStatus(s.end)==='soon').length;
  document.getElementById('st-exp').textContent=students.filter(s=>getStatus(s.end)==='expired').length;
}

function renderTable(list,cid){
  const el=document.getElementById(cid);
  if(!list.length){ el.innerHTML=`<div class="empty"><i class="ti ti-users" style="font-size:32px;display:block;margin-bottom:8px"></i>لا يوجد طلاب</div>`; return; }
  let h=`<table class="st"><thead><tr>
    <th style="width:22%">الاسم</th><th style="width:10%">الجنس</th><th style="width:19%">الحزام</th><th style="width:14%">هاتف الأب</th><th style="width:14%">ينتهي</th><th style="width:10%">الحالة</th><th style="width:11%">إجراءات</th>
  </tr></thead><tbody>`;
  list.forEach(s=>{
    const i=students.indexOf(s);
    h+=`<tr>
      <td style="font-weight:600">${s.name}</td>
      <td>${gBadge(s.gender)}</td>
      <td>${beltBadge(s.belt)}</td>
      <td dir="ltr">${s.dad||'—'}</td>
      <td>${fmtDate(s.end)}</td>
      <td>${sBadge(s.end)}</td>
      <td><div class="act-btns">
        <button class="ib" onclick="viewStudent(${i})" title="عرض"><i class="ti ti-eye"></i></button>
        <button class="ib" onclick="editStudent(${i})" title="تعديل"><i class="ti ti-edit"></i></button>
        <button class="ib del" onclick="delStudent(${i})" title="حذف"><i class="ti ti-trash"></i></button>
      </div></td>
    </tr>`;
  });
  h+='</tbody></table>';
  el.innerHTML=h;
}

function renderStudents(){
  let list=[...students];
  if(filter==='active') list=list.filter(s=>getStatus(s.end)==='active');
  else if(filter==='soon') list=list.filter(s=>getStatus(s.end)==='soon');
  else if(filter==='expired') list=list.filter(s=>getStatus(s.end)==='expired');
  else if(filter==='m') list=list.filter(s=>s.gender==='m');
  else if(filter==='f') list=list.filter(s=>s.gender==='f');
  renderTable(list,'students-list');
  updateStats();
}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStudents();
}

function showTab(t){
  ['students','add','search'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('show',x===t);
    document.getElementById('nb-'+x).classList.toggle('active',x===t);
  });
  if(t==='students') renderStudents();
}

function buildBeltGrid(selected){
  const g=document.getElementById('belt-grid');
  g.innerHTML='';
  BELTS.forEach(b=>{
    const d=document.createElement('button');
    d.type='button';
    d.className='belt-opt'+(selected===b.id?' sel':'');
    d.innerHTML=`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${b.color};border:1px solid ${b.border};flex-shrink:0"></span>${b.label}`;
    d.onclick=()=>{
      document.querySelectorAll('.belt-opt').forEach(x=>x.classList.remove('sel'));
      d.classList.add('sel');
      document.getElementById('f-belt').value=b.id;
    };
    g.appendChild(d);
  });
}

function saveStudent(){
  const name=document.getElementById('f-name').value.trim();
  const gender=document.getElementById('f-gender').value;
  const start=document.getElementById('f-start').value;
  const end=document.getElementById('f-end').value;
  if(!name||!gender||!start||!end){ toast('يرجى ملء الحقول المطلوبة *',true); return; }
  const obj={
    name,gender,
    dob:document.getElementById('f-dob').value,
    dad:document.getElementById('f-dad').value.trim(),
    mom:document.getElementById('f-mom').value.trim(),
    start,end,
    notes:document.getElementById('f-notes').value.trim(),
    belt:document.getElementById('f-belt').value,
    created:new Date().toISOString()
  };
  const eid=document.getElementById('f-edit-id').value;
  if(eid!==''){
    students[parseInt(eid)]=obj;
    toast('تم تحديث بيانات الطالب بنجاح ✓');
  } else {
    students.push(obj);
    toast('تم تسجيل الطالب بنجاح ✓');
  }
  save();
  cancelEdit();
  showTab('students');
}

function cancelEdit(){
  document.getElementById('f-edit-id').value='';
  document.getElementById('form-title').textContent='تسجيل طالب جديد';
  document.getElementById('save-btn-lbl').textContent='حفظ التسجيل';
  ['f-name','f-gender','f-dob','f-dad','f-mom','f-start','f-end','f-notes','f-belt'].forEach(id=>document.getElementById(id).value='');
  buildBeltGrid('');
}

function editStudent(i){
  const s=students[i];
  document.getElementById('f-edit-id').value=i;
  document.getElementById('f-name').value=s.name;
  document.getElementById('f-gender').value=s.gender;
  document.getElementById('f-dob').value=s.dob||'';
  document.getElementById('f-dad').value=s.dad||'';
  document.getElementById('f-mom').value=s.mom||'';
  document.getElementById('f-start').value=s.start||'';
  document.getElementById('f-end').value=s.end||'';
  document.getElementById('f-notes').value=s.notes||'';
  document.getElementById('f-belt').value=s.belt||'';
  document.getElementById('form-title').textContent='تعديل: '+s.name;
  document.getElementById('save-btn-lbl').textContent='حفظ التعديلات';
  buildBeltGrid(s.belt||'');
  showTab('add');
}

function delStudent(i){
  if(!confirm(`هل تريد حذف ${students[i].name}؟`)) return;
  students.splice(i,1);
  save();
  renderStudents();
  toast('تم الحذف');
}

function viewStudent(i){
  const s=students[i];
  document.getElementById('modal-title').textContent=s.name;
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">${gBadge(s.gender)} ${sBadge(s.end)} ${beltBadge(s.belt)}</div>
    <div class="detail-row"><span class="dk">الاسم</span><span style="font-weight:600">${s.name}</span></div>
    <div class="detail-row"><span class="dk">تاريخ الميلاد</span><span>${fmtDate(s.dob)}</span></div>
    <div class="detail-row"><span class="dk">هاتف الأب</span><span dir="ltr">${s.dad||'—'}</span></div>
    <div class="detail-row"><span class="dk">هاتف الأم</span><span dir="ltr">${s.mom||'—'}</span></div>
    <div class="detail-row"><span class="dk">تاريخ التسجيل</span><span>${fmtDate(s.start)}</span></div>
    <div class="detail-row"><span class="dk">انتهاء الاشتراك</span><span>${fmtDate(s.end)}</span></div>
    <div class="detail-row"><span class="dk">ملاحظات</span><span>${s.notes||'—'}</span></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-s" onclick="closeModal()">إغلاق</button>
      <button class="btn-p" onclick="closeModal();editStudent(${i})"><i class="ti ti-edit"></i> تعديل</button>
    </div>`;
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }

function doSearch(){
  const q=document.getElementById('search-inp').value.trim().toLowerCase();
  if(!q){ document.getElementById('search-results').innerHTML=''; return; }
  const res=students.filter(s=>s.name.toLowerCase().includes(q)||(s.dad&&s.dad.includes(q))||(s.mom&&s.mom.includes(q)));
  renderTable(res,'search-results');
}

function toast(msg,err){
  const t=document.getElementById('toast');
  document.getElementById('toast-msg').textContent=msg;
  t.className='toast show'+(err?' err':'');
  setTimeout(()=>t.className='toast',2800);
}

// Init
document.getElementById('f-start').value=new Date().toISOString().split('T')[0];
buildBeltGrid('');
renderStudents();
</script>
</body>
</html>
