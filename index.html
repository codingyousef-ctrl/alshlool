<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الشلول للتايكوندو">
  <meta name="description" content="نظام إدارة طلاب مركز الشلول للتايكوندو">
  <title>مركز الشلول للتايكوندو</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    :root {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #f7f7f9;
      --border: #e0e0ea;
      --border2: #ebebf2;
      --text: #0d0d0d;
      --text2: #6b6b80;
      --red: #cc1a1a;
      --red-dark: #a01212;
      --green: #1a7a1a;
      --header: #0d0d0d;
      --nav: #111111;
      --jordan-red: #cc1a1a;
      --jordan-green: #1a6b1a;
      --jordan-black: #0d0d0d;
      --font: 'Cairo', sans-serif;
    }

    [data-theme="dark"] {
      --bg: #111118;
      --surface: #1c1c26;
      --surface2: #16161e;
      --border: #2a2a3a;
      --border2: #222230;
      --text: #e8e8f0;
      --text2: #8888a0;
      --header: #080810;
      --nav: #060610;
    }

    [data-theme="dark"] .b-act {
      background: #0f2a08;
      color: #5ec43e
    }

    [data-theme="dark"] .b-exp {
      background: #2a0a0a;
      color: #f07070
    }

    [data-theme="dark"] .b-soon {
      background: #2a1a04;
      color: #e8a030
    }

    [data-theme="dark"] .b-m {
      background: #081830;
      color: #5090e8
    }

    [data-theme="dark"] .b-f {
      background: #280a18;
      color: #e870a8
    }

    [data-theme="dark"] .b-frozen {
      background: #082a30;
      color: #5090e8
    }

    [data-theme="dark"] .b-stopped {
      background: #1a0828;
      color: #b870e8
    }

    [data-theme="dark"] .belt-opt.sel {
      background: #1a0808;
      color: #cc1a1a;
      border-color: #cc1a1a
    }

    [data-theme="dark"] input,
    [data-theme="dark"] select {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border)
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--font);
      direction: rtl;
      background: var(--bg);
      min-height: 100vh;
      transition: background .3s, color .3s
    }

    /* ── Lock Screen ── */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: linear-gradient(160deg, #0d0d0d 0%, #1a0505 50%, #050d0d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
      padding: 30px 20px;
    }

    #lock-screen.hide {
      display: none
    }

    .lock-logo {
      width: 160px;
      height: 160px;
      margin-bottom: 24px;
      animation: logoIn .8s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(.6) rotate(-10deg)
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0)
      }
    }

    .lock-title {
      color: white;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      animation: fadeUp .6s .2s both;
    }

    .lock-sub {
      color: rgba(255, 255, 255, .5);
      font-size: 13px;
      margin-bottom: 32px;
      animation: fadeUp .6s .3s both
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .lock-box {
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 16px;
      padding: 24px 22px;
      width: 100%;
      max-width: 340px;
      animation: fadeUp .6s .4s both;
      backdrop-filter: blur(10px);
    }

    .lock-label {
      color: rgba(255, 255, 255, .7);
      font-size: 12px;
      margin-bottom: 7px;
      display: block
    }

    .lock-input-wrap {
      position: relative;
      margin-bottom: 16px
    }

    .lock-inp {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 10px;
      color: white;
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 3px;
      direction: ltr;
      text-align: center;
      transition: border-color .2s, background .2s;
    }

    .lock-inp:focus {
      outline: none;
      border-color: #cc1a1a;
      background: rgba(204, 26, 26, .1)
    }

    .lock-inp::placeholder {
      letter-spacing: 1px;
      color: rgba(255, 255, 255, .3)
    }

    .eye-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255, 255, 255, .4);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .lock-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #cc1a1a, #8b0000);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 20px rgba(204, 26, 26, .4);
    }

    .lock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(204, 26, 26, .5)
    }

    .lock-btn:active {
      transform: translateY(0)
    }

    .lock-err {
      color: #f07070;
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      min-height: 18px;
      transition: opacity .2s;
    }

    .lock-err.hide {
      opacity: 0
    }

    /* ── PWA Banner ── */
    #pwa-banner {
      display: none;
      background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
      color: white;
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      border-bottom: 1px solid rgba(204, 26, 26, .3);
    }

    #pwa-banner.show {
      display: flex
    }

    .pwa-btn {
      background: #cc1a1a;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font);
      font-size: 12px;
      cursor: pointer
    }

    .pwa-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, .6);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px
    }

    /* ── App Shell ── */
    .app {
      min-height: 100vh
    }

    .header {
      background: var(--header);
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #cc1a1a;
    }

    .logo-wrap {
      flex-shrink: 0;
      width: 46px;
      height: 46px
    }

    .logo-wrap svg {
      width: 46px;
      height: 46px
    }

    /* Real logo SVG embedded */
    .logo-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover
    }

    .header-info {
      flex: 1
    }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      color: white;
      letter-spacing: .3px
    }

    .header p {
      font-size: 11px;
      color: rgba(255, 255, 255, .5);
      margin-top: 1px
    }

    .header-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0
    }

    .icon-btn {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .12);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background .2s, transform .2s;
    }

    .icon-btn:hover {
      background: rgba(204, 26, 26, .4);
      transform: rotate(15deg)
    }

    .nav {
      background: var(--nav);
      display: flex;
      gap: 2px;
      padding: 6px 14px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .nb {
      padding: 7px 12px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, .55);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nb.active,
    .nb:hover {
      background: #cc1a1a;
      color: white
    }

    /* ── Content ── */
    .content {
      padding: 16px;
      display: none;
      overflow-y: auto
    }

    .content.show {
      display: block
    }

    #tab-add {
      padding-bottom: 30px
    }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      transition: background .3s, border-color .3s;
    }

    .sec-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 14px
    }

    .stat {
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      transition: background .3s;
    }

    .stat-n {
      font-size: 26px;
      font-weight: 700
    }

    .stat-l {
      font-size: 11px;
      color: var(--text2);
      margin-top: 3px
    }

    /* Form */
    .fg {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      font-size: 12px;
      color: var(--text2);
      font-weight: 500
    }

    input,
    select {
      padding: 8px 10px;
      border: 0.5px solid var(--border);
      border-radius: 9px;
      font-family: var(--font);
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
      direction: rtl;
      width: 100%;
      transition: background .3s, color .3s, border-color .2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #cc1a1a;
      box-shadow: 0 0 0 3px rgba(204, 26, 26, .1)
    }

    /* Buttons */
    .btn-p {
      background: linear-gradient(135deg, #cc1a1a, #8b0000);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 9px;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 12px rgba(204, 26, 26, .3);
      transition: transform .15s, box-shadow .15s;
    }

    .btn-p:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(204, 26, 26, .4)
    }

    .btn-s {
      background: transparent;
      color: var(--text2);
      border: 0.5px solid var(--border);
      padding: 7px 14px;
      border-radius: 9px;
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-s:hover {
      background: var(--surface2)
    }

    /* Filter */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    .fb {
      padding: 5px 12px;
      border: 0.5px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      color: var(--text2);
      font-family: var(--font);
      transition: all .15s;
    }

    .fb.active {
      background: #cc1a1a;
      color: white;
      border-color: #cc1a1a
    }

    /* Table */
    .tbl-wrap {
      overflow-x: auto
    }

    table.st {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed
    }

    table.st th {
      padding: 9px 10px;
      text-align: right;
      font-weight: 600;
      color: var(--text2);
      border-bottom: 0.5px solid var(--border2);
      font-size: 11px;
    }

    table.st td {
      padding: 9px 10px;
      border-bottom: 0.5px solid var(--border2);
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    table.st tr:hover td {
      background: var(--surface2)
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600
    }

    .b-act {
      background: #e8f5e0;
      color: #2a6b10
    }

    .b-exp {
      background: #fce8e8;
      color: #a01414
    }

    .b-soon {
      background: #fef3e0;
      color: #7a4a08
    }

    .b-m {
      background: #e4f0fc;
      color: #1455a0
    }

    .b-f {
      background: #fce8f4;
      color: #922858
    }

    .b-frozen {
      background: #e0f2f7;
      color: #1a6ba0
    }

    .b-stopped {
      background: #f0e8f8;
      color: #6a1a9a
    }

    /* Belt */
    .belt-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px
    }

    .belt-opt {
      border: 0.5px solid var(--border);
      border-radius: 9px;
      padding: 7px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      color: var(--text);
      transition: all .12s;
    }

    .belt-opt:hover {
      border-color: #cc1a1a
    }

    .belt-opt.sel {
      border-color: #cc1a1a;
      background: #fff0f0;
      color: #8b0000
    }

    /* Actions */
    .act-btns {
      display: flex;
      gap: 5px
    }

    .ib {
      background: transparent;
      border: 0.5px solid var(--border2);
      border-radius: 8px;
      padding: 4px 7px;
      cursor: pointer;
      color: var(--text2);
      font-size: 13px;
      transition: all .15s;
    }

    .ib:hover {
      border-color: #cc1a1a;
      color: #cc1a1a
    }

    .ib.del:hover {
      color: #a01414;
      border-color: #f09595
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text2);
      font-size: 13px
    }

    .divider {
      border: none;
      border-top: 0.5px solid var(--border2);
      margin: 14px 0
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-bg.show {
      display: flex
    }

    .modal {
      background: var(--surface);
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      transition: background .3s;
    }

    .modal-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text2);
      padding: 2px 6px
    }

    /* Detail rows */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border2);
      font-size: 13px;
      color: var(--text);
    }

    .detail-row:last-child {
      border-bottom: none
    }

    .dk {
      color: var(--text2)
    }

    /* Toast */
    .toast-area {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0
    }

    .toast {
      background: #0d0d0d;
      color: white;
      padding: 10px 18px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 7px;
      border-left: 3px solid #1a7a1a;
    }

    .toast.show {
      display: inline-flex
    }

    .toast.err {
      background: #6b0a0a;
      border-left-color: #cc1a1a
    }

    @media(max-width:480px) {
      .stats-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .form-grid {
        grid-template-columns: 1fr
      }

      .full {
        grid-column: auto
      }

      .belt-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      #suits-grid {
        grid-template-columns: repeat(2, 1fr) !important
      }

      table.st th:nth-child(4),
      table.st td:nth-child(4) {
        display: none
      }
    }

    @media print {

      .header,
      .nav,
      .filter-row,
      .act-btns,
      .btn-p,
      .btn-s,
      .ib,
      #pwa-banner,
      .toast-area {
        display: none !important;
      }

      .content {
        display: block !important;
        padding: 0;
      }

      .card {
        border: 1px solid #ccc;
        box-shadow: none;
      }

      body {
        background: white;
        color: black;
      }
    }
  </style>
</head>

<body>

  <!-- ── Lock Screen ── -->
  <div id="lock-screen">
